server:
  port: 8081

spring:
  application:
    name: idempiere-ai-assistant
  profiles:
    default: ollama
  ai:
    # Only the chat model is used; switch off the other model types both starters would create.
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

assistant:
  idempiere:
    base-url: ${IDEMPIERE_BASE_URL:http://localhost:8080}
    timeout: 15s
    verify-ttl: 60s
    verify-path: /api/v1/models/ad_client?$top=1&$select=AD_Client_ID
  chat:
    memory-messages: 20
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
