server:
  port: 8081          # iDempiere uses 8080

spring:
  application:
    name: payment-gateway-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_service}
    username: ${DB_USER:payment_service}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate     # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

gateway:
  default-gateway: razorpay

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

service:
  api-key: ${PAYMENT_SERVICE_API_KEY}